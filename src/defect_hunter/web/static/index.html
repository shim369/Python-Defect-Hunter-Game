<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>欠陥ハンター (人間 vs AI)</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
      <circle cx="16" cy="16" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M16 3v7M16 22v7M3 16h7M22 16h7" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      <circle cx="16" cy="16" r="2" fill="currentColor"/>
    </svg>
    <span class="brand-name" data-i18n="brand_name">欠陥ハンター</span>
  </div>
  <div class="top-right">
    <div class="vs"><span class="chip human">YOU</span><span class="vs-mark">VS</span><span class="chip ai">AI</span></div>
    <!-- 言語スイッチ。選択は localStorage に保存される -->
    <div class="lang-switch" role="group" aria-label="Language">
      <button type="button" data-lang="ja">日本語</button><button type="button" data-lang="en">EN</button>
    </div>
  </div>
</header>

<main>
  <!-- タイトル -->
  <section id="screen-title" class="card hero">
    <p class="eyebrow">SURFACE DEFECT INSPECTION</p>
    <h1 data-i18n-html="hero_h1"></h1>
    <p class="lead" data-i18n-html="lead"></p>
    <ul class="rules">
      <li data-i18n-html="rule_1"></li>
      <li data-i18n-html="rule_2"></li>
      <li data-i18n-html="rule_3"></li>
    </ul>
    <button id="btn-start" class="primary big" data-i18n="btn_start"></button>
  </section>

  <!-- 出題 -->
  <section id="screen-question" class="card" hidden>
    <div class="status">
      <span id="q-progress"></span>
      <div class="bar"><div id="q-bar"></div></div>
    </div>
    <div class="play">
      <div class="canvas-wrap" id="draw-wrap">
        <canvas id="canvas-image"></canvas>
        <canvas id="canvas-draw"></canvas>
      </div>
      <div class="controls">
        <h3 data-i18n="controls"></h3>
        <label class="brush"><span data-i18n="brush"></span> <input type="range" id="brush" min="1" max="8" value="3"></label>
        <button id="btn-clear" data-i18n="btn_clear"></button>
        <button id="btn-nodefect" data-i18n="btn_nodefect"></button>
        <button id="btn-submit" class="primary" data-i18n="btn_submit"></button>
        <p class="note" data-i18n="controls_note"></p>
      </div>
    </div>
  </section>

  <!-- 結果 (1問) -->
  <section id="screen-result" class="card" hidden>
    <h2 id="r-title"></h2>
    <div class="panels">
      <figure><canvas id="p-image"></canvas><figcaption><i class="dot plain"></i><span data-i18n="cap_image"></span></figcaption></figure>
      <figure><canvas id="p-gt"></canvas><figcaption><i class="dot gt"></i><span data-i18n="cap_gt"></span></figcaption></figure>
      <figure><canvas id="p-player"></canvas><figcaption id="cap-player"></figcaption></figure>
      <figure><canvas id="p-ai"></canvas><figcaption id="cap-ai"></figcaption></figure>
    </div>
    <button id="btn-next" class="primary"></button>
  </section>

  <!-- 中間・最終成績 -->
  <section id="screen-summary" class="card" hidden>
    <h2 id="s-title"></h2>
    <table id="s-table"></table>
    <div class="slider-box">
      <label><span data-i18n="thr_label"></span> <b id="thr-val" class="mono"></b>
        <input type="range" id="thr" min="0.01" max="0.99" step="0.01"></label>
      <p class="note" data-i18n="thr_note"></p>
    </div>
    <button id="btn-continue" class="primary"></button>
  </section>
</main>
<footer data-i18n="footer"></footer>
<script src="/static/game.js"></script>
</body>
</html>
