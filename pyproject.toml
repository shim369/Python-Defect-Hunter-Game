[project]
name = "python-defect-hunter-game"
version = "0.1.0"
requires-python = ">=3.15.1"
dependencies = [
    "fastapi>=0.162.0",
    "numpy>=2.5.4",
    "opencv-python-headless>=5.0.0.93",
    "torch>=2.15.0",
    "torchvision>=0.29.2",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "torchmetrics>=1.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/defect_hunter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

# Linux では PyPI の torch が CUDA 同梱 (数 GB, aarch64 でも同様) になるため、CPU 版の index を使う。
# macOS は PyPI のままで CPU 版が入る。
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
